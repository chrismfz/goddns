# /etc/goddns/goddns.conf  (0640 root:goddns — the daemon runs as the
# goddns user and must be able to read this; keep secrets in goddns.env,
# which only systemd/root reads)
#
# goddns re-reads this file while running (cfm-style polling, every
# reload_interval seconds, or instantly on SIGHUP). Most keys apply live;
# changes to listen / tls_mode / cert paths / acme_* / db_path are logged
# as "needs a restart".

listen     = ":8245"
db_path    = "/var/lib/goddns/goddns.db"

# How often (seconds) to check this file for changes.
reload_interval = 20

# ---------------------------------------------------------------------------
# TLS
# ---------------------------------------------------------------------------
# "files": serve an existing cert (e.g. your certbot/wildcard pair below).
#          Renewals on disk are picked up automatically — no restart.
# "acme":  goddns issues & renews its own Let's Encrypt cert via DNS-01,
#          writing the _acme-challenge TXT record through the same BIND
#          over RFC2136. Never needs port 80/443 — fully portable.
tls_mode   = "files"

# files mode:
cert_file  = "/etc/letsencrypt/live/sdns.myip.gr/fullchain.pem"
key_file   = "/etc/letsencrypt/live/sdns.myip.gr/privkey.pem"

# acme mode:
#acme_domain  = "sdns.myip.gr"
#acme_email   = "hostmaster@myip.gr"
#acme_storage = "/var/lib/goddns/acme"
## Test against staging first:
#acme_ca      = "https://acme-staging-v02.api.letsencrypt.org/directory"
## TSIG key used for the _acme-challenge TXT writes. Defaults to the main
## tsig_* key below; a dedicated key keeps the DDNS key free of TXT grants.
#acme_tsig_name   = "acme-update"
#acme_tsig_algo   = "hmac-sha256"
## Prefer env GODDNS_ACME_TSIG_SECRET (set in /etc/goddns/goddns.env).
#acme_tsig_secret = ""

# ---------------------------------------------------------------------------
# DNS / TSIG (the DDNS update key)
# ---------------------------------------------------------------------------
# Where to send the RFC2136 UPDATE. named usually listens on loopback.
dns_server = "127.0.0.1:53"

# Must match the key name in named.conf.
tsig_name  = "ddns-update"
tsig_algo  = "hmac-sha256"

# Prefer setting the secret via the systemd unit's environment file
# (GODDNS_TSIG_SECRET in /etc/goddns/goddns.env) instead of cleartext here.
#tsig_secret = "base64-secret-from-tsig-keygen"

# ---------------------------------------------------------------------------
# Reverse proxy mode (optional)
# ---------------------------------------------------------------------------
# A second TLS listener that routes by hostname to internal upstreams
# (iDRAC/BMC consoles, switches — things that can never have a proper cert).
# The [proxy."host"] table is hot-reloadable: add/remove hosts live; in
# tls_mode = "acme" new hosts get their own cert automatically (the
# update-policy needs:  grant <acme-key> wildcard *.internal.myip.gr. TXT;).
# The systemd unit has CAP_NET_BIND_SERVICE, so :443/:80 work without root.
#
#proxy_enabled = true
#proxy_listen  = ":443"
#proxy_redirect_listen = ":80"     # optional http -> https redirect
#
#[proxy."orion-idrac.internal.myip.gr"]
#upstream   = "https://10.23.201.200"
#allow      = ["84.54.49.0/24", "94.67.0.0/16"]   # ALWAYS set for BMCs
#rate_limit = 10                                  # req/s per client IP
## upstream_verify = true     # BMCs are self-signed; off by default
## preserve_host   = true     # keep inbound Host instead of upstream's

# ---------------------------------------------------------------------------
# Trusted proxies (for the DDNS endpoints)
# ---------------------------------------------------------------------------
# goddns is normally exposed DIRECTLY, so leave this empty: the connection
# peer IP is already the real client. Only populate it if you put goddns
# behind CFM/nginx, listing the proxy's source IP(s); goddns then honours
# X-Forwarded-For from those peers only, walking the chain right-to-left —
# i.e. the forwarded-header validation cpsrvd stopped doing.
#trusted_proxies = ["127.0.0.1/32", "84.54.49.3/32"]
