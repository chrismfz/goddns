# /etc/goddns/goddns.conf  (0640 root:goddns — the daemon runs as the
# goddns user and must be able to read this; keep secrets in goddns.env,
# which only systemd/root reads)
#
# goddns re-reads this file while running (cfm-style polling, every
# reload_interval seconds, or instantly on SIGHUP). Most keys apply live;
# changes to listen / tls_mode / cert paths / acme_* / db_path are logged
# as "needs a restart".
#
# ⚠ TOML ORDERING: every `key = value` setting must appear ABOVE the first
# [section] header. In TOML, any key written after a [admin] or
# [proxy."..."] header belongs to THAT section — so a top-level key placed
# below a section (e.g. proxy_enabled under [admin]) is silently mis-scoped.
# goddns now rejects such keys with an error naming the offender, but the
# rule is simple: all the plain keys below come first, the [sections] last.

listen     = ":8245"
db_path    = "/var/lib/goddns/goddns.db"

# How often (seconds) to check this file for changes.
reload_interval = 20

# Dedicated log file (DDNS updates, proxy errors, reload events) so they
# don't drown in journald next to named/other daemons. The package ships a
# logrotate config (copytruncate). Empty / commented = journald.
# Hot-swappable: change it and it applies on the next reload tick.
log_file = "/var/log/goddns.log"

# Separate file for the per-request "proxy-access" lines (nginx-style
# split: traffic here, events/errors in log_file). Empty = merged into
# log_file. Also hot-swappable and covered by the shipped logrotate.
access_log = "/var/log/goddns-access.log"

# Hostname clients use to reach the DDNS update endpoint (the public name
# that points at this server). Only used to pre-fill the admin UI's
# copy-paste help snippets; optional.
#public_host = "sdns.myip.gr"

# named.conf path for the read-only Zones view (`goddns zones` and the admin
# "zones" page). Default /etc/named.conf. The web page needs goddns to be
# able to read it — see README (add goddns to the 'named' group); the CLI as
# root always works.
#named_conf = "/etc/named.conf"

# ---------------------------------------------------------------------------
# TLS
# ---------------------------------------------------------------------------
# "files":  serve an existing cert (e.g. your certbot/wildcard pair below).
#           Renewals on disk are picked up automatically — no restart.
# "acme":   goddns issues & renews its own Let's Encrypt cert via DNS-01,
#           writing the _acme-challenge TXT record through the same BIND
#           over RFC2136. Never needs port 80/443 — fully portable.
# "hybrid": serve the file cert (cert_file/key_file) whenever it COVERS the
#           requested name and is in date; for anything it doesn't (a new
#           proxy host outside your wildcard, or an expired file), fall back
#           to ACME on-demand. Best of both: your wildcard handles the common
#           case instantly, the odd extra hostname self-issues. ACME is gated
#           to names goddns already knows (proxy hosts, acme_domain, admin
#           host, public_host), so a random SNI can't trigger LE orders. Set
#           BOTH the cert_file/key_file pair AND the acme_* block below; the
#           ACME fallback still needs DNS-01 authority for the name (BIND
#           authoritative, or an _acme-challenge CNAME delegation).
tls_mode   = "files"

# files mode:
cert_file  = "/etc/letsencrypt/live/sdns.myip.gr/fullchain.pem"
key_file   = "/etc/letsencrypt/live/sdns.myip.gr/privkey.pem"

# acme mode:
#acme_domain  = "sdns.myip.gr"
#acme_email   = "hostmaster@myip.gr"
#acme_storage = "/var/lib/goddns/acme"
## Test against staging first:
#acme_ca      = "https://acme-staging-v02.api.letsencrypt.org/directory"
## TSIG key used for the _acme-challenge TXT writes. Defaults to the main
## tsig_* key below; a dedicated key keeps the DDNS key free of TXT grants.
#acme_tsig_name   = "acme-update"
#acme_tsig_algo   = "hmac-sha256"
## Prefer env GODDNS_ACME_TSIG_SECRET (set in /etc/goddns/goddns.env).
#acme_tsig_secret = ""

# ---------------------------------------------------------------------------
# DNS / TSIG (the DDNS update key)
# ---------------------------------------------------------------------------
# Where to send the RFC2136 UPDATE. named usually listens on loopback.
dns_server = "127.0.0.1:53"

# Must match the key name in named.conf.
tsig_name  = "ddns-update"
tsig_algo  = "hmac-sha256"

# Prefer setting the secret via the systemd unit's environment file
# (GODDNS_TSIG_SECRET in /etc/goddns/goddns.env) instead of cleartext here.
#tsig_secret = "base64-secret-from-tsig-keygen"

# ---------------------------------------------------------------------------
# Trusted proxies (top-level — for the DDNS endpoints)
# ---------------------------------------------------------------------------
# goddns is normally exposed DIRECTLY, so leave this empty: the connection
# peer IP is already the real client. Only populate it if you put goddns
# behind CFM/nginx, listing the proxy's source IP(s); goddns then honours
# X-Forwarded-For from those peers only, walking the chain right-to-left —
# i.e. the forwarded-header validation cpsrvd stopped doing.
#trusted_proxies = ["127.0.0.1/32", "84.54.49.3/32"]

# ---------------------------------------------------------------------------
# Editable static zones (Phase 4, file-as-truth in-place editing)
# ---------------------------------------------------------------------------
# Static master zones goddns may edit IN PLACE with `goddns record add|del`.
# goddns rewrites only the changed record's line(s) (comments/formatting kept),
# checkzones, backs up, writes atomically and `rndc reload`s — and refuses to
# clobber a concurrent hand-edit. It NEVER edits a dynamic zone (those use
# RFC2136), a slave, a panel-managed zone, or one not listed here. Check a zone
# first with `goddns zone enable <zone>`, then add it below (goddns never edits
# this file itself). The CLI (run as root) always works; for editing from the
# ADMIN WEB UI the goddns daemon also needs write access to the zone file and to
# run `rndc reload` (a failed reload is auto-rolled-back). Raw whole-file edits
# (`goddns zone edit`) stay CLI-only.
#editable_zones = ["myip.gr", "i-eglezakis.gr"]

# Privileged write helper (recommended for web editing on an internet-facing
# box). Run `systemctl enable --now goddns-zoned` and set this; the admin UI then
# sends static-zone edits to that ROOT helper (which writes /var/named + reloads)
# instead of the daemon doing it — so the internet-facing daemon never touches
# the zone directory. The helper re-validates every edit against this config.
# Leave empty to let the daemon write directly (then it needs the perms itself).
#zoned_socket = "/run/goddns/zoned.sock"

# ---------------------------------------------------------------------------
# Reverse proxy mode (top-level enable flags; the per-host rules are in the
# [proxy."..."] sections at the bottom)
# ---------------------------------------------------------------------------
# A second TLS listener that routes by hostname to internal upstreams
# (iDRAC/BMC consoles, switches — things that can never have a proper cert).
# The [proxy."host"] table is hot-reloadable: add/remove hosts live; in
# tls_mode = "acme" new hosts get their own cert automatically (the
# update-policy needs:  grant <acme-key> wildcard *.internal.myip.gr. TXT;).
# The systemd unit has CAP_NET_BIND_SERVICE, so :443/:80 work without root.
#proxy_enabled = true
#proxy_listen  = ":443"
#proxy_redirect_listen = ":80"     # optional http -> https redirect

# ===========================================================================
# SECTIONS BELOW — everything from here down is a [table].
# Do NOT put any plain `key = value` after this line: TOML would scope it
# into the section above it. All top-level keys belong above this divider.
# ===========================================================================

# ---------------------------------------------------------------------------
# Admin web UI (optional, requires proxy_enabled above)
# ---------------------------------------------------------------------------
# A built-in dashboard served as a vhost on the proxy listener: view DDNS
# records (last IP / last seen), the proxy table, and tail the logs; plus
# add/delete DDNS tokens. It can rewrite DNS, so it stacks three gates:
#   1. allow  — client CIDRs (a real filter, not obscurity)
#   2. basic_auth — optional outer HTTP Basic (keeps scanners off the login)
#   3. a login session (signed cookie). users = the login credentials.
# Generate hashes with: goddns passwd -user chris
# The session key is auto-created at /var/lib/goddns/admin.secret (or set
# GODDNS_ADMIN_SECRET). users/allow/basic_auth hot-reload; enabling/moving
# the vhost needs a restart. Point a DNS name at this host (e.g. a static
# admin.internal.myip.gr -> goddns IP, covered by your wildcard cert).
#[admin]
#enabled = true
#host    = "admin.myip.gr"
#allow   = ["84.54.49.0/24", "94.67.0.0/16"]   # recommended; widen if needed
#users   = ["chris:$2a$10$..."]
#basic_auth  = ["gate:$2a$10$..."]             # optional second-front gate
#session_ttl = 8                               # hours

# ---------------------------------------------------------------------------
# Reverse proxy hosts (one [proxy."<hostname>"] table each)
# ---------------------------------------------------------------------------
#[proxy."orion-idrac.internal.myip.gr"]
#upstream   = "https://10.23.201.200"
#allow      = ["84.54.49.0/24", "94.67.0.0/16"]   # ALWAYS set for BMCs
#rate_limit = 10                                  # req/s per client IP
## For clients on CGNAT/mobile where CIDRs can't work, require HTTP Basic
## auth instead of (or on top of) the allow list. bcrypt only — generate
## entries with:  goddns passwd -user chris
## basic_auth = ["chris:$2a$10$..."]
## upstream_verify = true     # BMCs are self-signed; off by default
## preserve_host   = true     # keep inbound Host instead of upstream's
## bmc_compat      = true     # Dell iDRAC / HP iLO: if the UI loads but the
##                            # virtual console returns "400 Bad Request",
##                            # this rewrites Origin/Referer + self-redirects so
##                            # the console works. Off for normal apps (HAOS/NAS).
## console_ports   = [5900]   # the virtual console (KVM) runs on its OWN port,
##                            # not 443 (iDRAC8 HTML5 = 5900; other BMCs differ).
##                            # goddns opens a TLS listener per port, SNI-routes,
##                            # and splices to upstream:port. allow is enforced
##                            # here too — keep it set. Listeners hot-reload (no
##                            # restart). Use the iDRAC HTML5 console plug-in.
